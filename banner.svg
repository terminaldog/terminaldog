<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <radialGradient id="glowTop" cx="35%" cy="-10%" r="85%">
      <stop offset="0%" stop-color="#a8c8ee" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#9cc1e7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a0d13" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="95%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#3e5f8f" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0a0d13" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2f7fd"/>
      <stop offset="100%" stop-color="#b9d4f0"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9cc1e7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9cc1e7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9cc1e7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 深色底与光晕 -->
  <rect width="880" height="230" rx="28" fill="#0a0d13"/>
  <rect width="880" height="230" rx="28" fill="url(#glowTop)"/>
  <rect width="880" height="230" rx="28" fill="url(#glowRight)"/>
  <rect width="880" height="230" rx="28" fill="none" stroke="#22314a" stroke-opacity="0.7" stroke-width="1"/>

  <!-- 顶部细辉光线 -->
  <line x1="140" y1="52" x2="740" y2="52" stroke="url(#lineGrad)" stroke-width="1.2"/>

  <!-- 标题 -->
  <text x="440" y="118" text-anchor="middle" font-size="54" font-weight="600" fill="url(#titleGrad)">Hi 👋</text>

  <!-- 副句 -->
  <text x="440" y="166" text-anchor="middle" font-size="19" font-weight="400" fill="#8fa8c9" letter-spacing="2">在学编程 · 慢慢积累</text>
</svg>
