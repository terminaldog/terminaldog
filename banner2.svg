<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <radialGradient id="glowTop" cx="35%" cy="-15%" r="90%">
      <stop offset="0%" stop-color="#a8c8ee" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#9cc1e7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a0d13" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="95%" cy="95%" r="65%">
      <stop offset="0%" stop-color="#3e5f8f" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0a0d13" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2f7fd"/>
      <stop offset="100%" stop-color="#b9d4f0"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9cc1e7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9cc1e7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9cc1e7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 深色底与光晕 -->
  <rect width="880" height="200" rx="26" fill="#0a0d13"/>
  <rect width="880" height="200" rx="26" fill="url(#glowTop)"/>
  <rect width="880" height="200" rx="26" fill="url(#glowRight)"/>
  <rect width="880" height="200" rx="26" fill="none" stroke="#22314a" stroke-opacity="0.7" stroke-width="1"/>

  <!-- 顶部细辉光线 -->
  <line x1="160" y1="46" x2="720" y2="46" stroke="url(#lineGrad)" stroke-width="1.2"/>

  <!-- 标题 -->
  <text x="440" y="121" text-anchor="middle" font-size="56" font-weight="600" fill="url(#titleGrad)">Hi 👋</text>
</svg>
